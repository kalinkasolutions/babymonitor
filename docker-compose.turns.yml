# Terminating TLS in the relay itself, for when this host is the one holding the certificate.
#
#   docker compose -f docker-compose.yml -f docker-compose.turns.yml up -d
#
# The usual arrangement is the other way round: a reverse proxy that already has a certificate
# listens on 5349 and forwards the plain TCP to this container's 3478, so no private key has to
# be copied here at all.
services:
  coturn:
    # The image runs coturn as nobody, which cannot read a mode-600 private key. Running as the
    # key's owner keeps TLS working without making the key world-readable or running as root.
    user: "${TLS_KEY_UID:?set TLS_KEY_UID to the owner of the private key}:${TLS_KEY_GID:-1000}"

    # Replaces the whole command in docker-compose.yml, so everything but the TLS lines is repeated
    # from there and has to be kept the same.
    command: >
      --realm=${TURN_HOST}
      --server-name=${TURN_HOST}
      --listening-ip=${TURN_LISTENING_IP}
      ${TURN_EXTERNAL_IP:+--external-ip=$TURN_EXTERNAL_IP}
      --listening-port=3478
      --min-port=49160
      --max-port=49200
      --use-auth-secret
      --no-tcp-relay
      --static-auth-secret=${TURN_SECRET:?set TURN_SECRET in .env}
      --tls-listening-port=5349
      --cert=/etc/coturn/tls.crt
      --pkey=/etc/coturn/tls.key
      --no-tlsv1
      --no-tlsv1_1
      --no-multicast-peers
      --denied-peer-ip=0.0.0.0-0.255.255.255
      --denied-peer-ip=10.0.0.0-10.255.255.255
      --denied-peer-ip=127.0.0.0-127.255.255.255
      --denied-peer-ip=169.254.0.0-169.254.255.255
      --denied-peer-ip=172.16.0.0-172.31.255.255
      --denied-peer-ip=192.168.0.0-192.168.255.255
      --denied-peer-ip=::1
      --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      ${TURN_TEST_PEERS:+--allowed-peer-ip=$TURN_TEST_PEERS}
      --user-quota=12
      --total-quota=100
      --max-bps=256000
      --stale-nonce=600
      --fingerprint
      --no-cli
      --no-stdout-log
      --simple-log
      --log-file=stdout

    volumes:
      - ${TLS_CERT_PATH:?set TLS_CERT_PATH}:/etc/coturn/tls.crt:ro
      - ${TLS_KEY_PATH:?set TLS_KEY_PATH}:/etc/coturn/tls.key:ro
