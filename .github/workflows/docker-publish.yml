# Publishes the backend image. Tagged releases only: docker-compose pulls `latest`, and a push to
# master that moved `latest` would redeploy the monitor in every house running it.
#
# Needs two repository secrets: DOCKER_HUB_USERNAME and DOCKER_HUB_API_TOKEN.
name: Build and Push Docker Image

on:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_API_TOKEN }}

      # Two tags from one build: the release tag, so a deployment can be pinned and rolled back,
      # and `latest`, which is what docker-compose.yml pulls.
      - name: Build and push Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t ${{ secrets.DOCKER_HUB_USERNAME }}/babyphone:${{ github.ref_name }} \
            -t ${{ secrets.DOCKER_HUB_USERNAME }}/babyphone:latest \
            --push .
