services:
  app:
    container_name: babymonitor
    image: kalinkasolutions/babymonitor:latest
    # Bound to loopback by default, because the app trusts whatever the proxy in front tells it
    # about the original request. Anything that can reach this port can claim to be that proxy.
    # Set APP_BIND_ADDRESS to 0.0.0.0 only when nginx is on another machine, and then name that
    # machine in PROXY_TRUSTED rather than leaving PROXY_TRUST_ANY on.
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-7881}:5001"
    restart: always
    environment:
      - ASPNETCORE_URLS=http://+:5001
      # Development only adds the cause of a server error to the response. Leave it Production.
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      # nginx terminates TLS and forwards plain HTTP, so only it knows the request was secure.
      # Those headers are forgeable, so they are believed only from an address named here. The
      # framework's own default is loopback, which inside a container means nobody — the proxy
      # always arrives as something else, so without one of these two the headers are ignored and
      # every request looks like plain HTTP from the proxy's own address.
      - Proxy__TrustAny=${PROXY_TRUST_ANY:-true}
      # Instead of TrustAny when the port is reachable by anything but the proxy. Addresses or
      # CIDR ranges, numbered from zero: Proxy__Trusted__0, Proxy__Trusted__1, and so on.
      - Proxy__Trusted__0=${PROXY_TRUSTED:-}
      # Minimum log level written to the console. One of:
      # Trace, Debug, Information, Warning, Error, Critical. Defaults to Information.
      - Logging__LogLevel__Default=${LOG_LEVEL:-Information}
      # Optional. A phone that sends this key also gets the home relay below. Nothing else needs it.
      - Server__Key=${SERVER_KEY:-}
      # Also ships the server's log, and every line the phones upload, to Loki.
      - Loki__Enabled=${LOKI_ENABLED:-false}
      - Loki__Uri=${LOKI_URI:-}
      # The relay. This secret is shared with coturn below — the backend signs credentials with
      # it and coturn recomputes the same signature, which is why there are no accounts to
      # provision. Leave it blank to run with no relay at all: two phones on one WiFi never need
      # one, and most connections across the internet manage without it too.
      # Two names on purpose. Relayed media is UDP straight to this host and cannot be proxied,
      # so TURN_HOST must point here. TURNS_HOST is whatever terminates TLS — a reverse proxy
      # elsewhere, most likely — and is only used by the one path that needs to look like HTTPS.
      - Turn__Secret=${TURN_SECRET:-}
      - Turn__Urls__0=stun:${TURN_HOST}:3478
      - Turn__Urls__1=turn:${TURN_HOST}:3478?transport=udp
      - Turn__Urls__2=turn:${TURN_HOST}:3478?transport=tcp
      - Turn__Urls__3=turns:${TURNS_HOST}:5349?transport=tcp
      # The home relay, handed only to phones that sent SERVER_KEY. Its own secret, or a credential
      # for the open relay would work on this one too.
      - HomeRelay__Secret=${HOME_RELAY_SECRET:-}
      - HomeRelay__Urls__0=turn:${TURN_HOST}:3480?transport=udp
      - HomeRelay__Urls__1=turn:${TURN_HOST}:3480?transport=tcp

  coturn:
    container_name: babymonitor-turn
    image: coturn/coturn:4.7-alpine
    restart: always

    # Host networking, not published ports. A relay hands out the address it sees itself on, and
    # behind Docker's NAT that is a container address no phone can reach. It also avoids one
    # userland proxy process per port in the relay range.
    network_mode: host

    # Every setting is a flag here, so this file and .env are the whole installation. Nothing in
    # it is a credential: the secret comes from the environment.
    # --no-tcp-relay because WebRTC only ever relays UDP, and a TCP relay is a way into the network.
    command: >
      --realm=${TURN_HOST}
      --server-name=${TURN_HOST}
      --listening-ip=${TURN_LISTENING_IP}
      ${TURN_EXTERNAL_IP:+--external-ip=$TURN_EXTERNAL_IP}
      --listening-port=3478
      --min-port=49160
      --max-port=49200
      --use-auth-secret
      --no-tcp-relay
      --static-auth-secret=${TURN_SECRET:?set TURN_SECRET in .env}
      --no-tls
      --no-dtls
      --no-multicast-peers
      --denied-peer-ip=0.0.0.0-0.255.255.255
      --denied-peer-ip=10.0.0.0-10.255.255.255
      --denied-peer-ip=127.0.0.0-127.255.255.255
      --denied-peer-ip=169.254.0.0-169.254.255.255
      --denied-peer-ip=172.16.0.0-172.31.255.255
      --denied-peer-ip=192.168.0.0-192.168.255.255
      --denied-peer-ip=::1
      --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      ${TURN_TEST_PEERS:+--allowed-peer-ip=$TURN_TEST_PEERS}
      --user-quota=12
      --total-quota=100
      --max-bps=256000
      --stale-nonce=600
      --fingerprint
      --no-cli
      --no-stdout-log
      --simple-log
      --log-file=stdout

    # Just "is it answering on 3478": a real STUN exchange needs a credential, and minting one
    # here would mean putting the secret in a second place. Probes the pinned listening address
    # rather than loopback, which coturn deliberately no longer binds.
    healthcheck:
      test: ["CMD-SHELL", "nc -z -u -w1 ${TURN_LISTENING_IP} 3478 || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s

  # The home relay: like the one above, with its own ports and secret, but it may reach this
  # house's own network. That lets a phone outside reach one on the home WiFi. Only started with
  # COMPOSE_PROFILES=home-relay.
  coturn-home:
    container_name: babymonitor-turn-home
    image: coturn/coturn:4.7-alpine
    restart: always
    profiles: [ home-relay ]
    network_mode: host

    # Not ":?" checks: compose would demand these even from installs that never start this relay.
    # --allowed-peer-ip wins over the denied ranges, which is what opens the one home range.
    command: >
      --realm=${TURN_HOST}
      --server-name=${TURN_HOST}
      --listening-ip=${TURN_LISTENING_IP}
      ${TURN_EXTERNAL_IP:+--external-ip=$TURN_EXTERNAL_IP}
      --listening-port=3480
      --min-port=49201
      --max-port=49240
      --use-auth-secret
      --no-tcp-relay
      --static-auth-secret=${HOME_RELAY_SECRET:-}
      --no-tls
      --no-dtls
      --no-multicast-peers
      --denied-peer-ip=0.0.0.0-0.255.255.255
      --denied-peer-ip=10.0.0.0-10.255.255.255
      --denied-peer-ip=127.0.0.0-127.255.255.255
      --denied-peer-ip=169.254.0.0-169.254.255.255
      --denied-peer-ip=172.16.0.0-172.31.255.255
      --denied-peer-ip=192.168.0.0-192.168.255.255
      --denied-peer-ip=::1
      --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      --allowed-peer-ip=${HOME_RELAY_PEERS:-}
      --user-quota=12
      --total-quota=100
      --max-bps=256000
      --stale-nonce=600
      --fingerprint
      --no-cli
      --no-stdout-log
      --simple-log
      --log-file=stdout

    healthcheck:
      test: ["CMD-SHELL", "nc -z -u -w1 ${TURN_LISTENING_IP} 3480 || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
