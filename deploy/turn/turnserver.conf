# Babyphone relay. Only used when two phones cannot reach each other directly — on the same WiFi
# they never touch this, and audio-only relaying is a rounding error even when they do.

# The name, the address to bind and the secret all arrive on the command line, so this file holds
# nothing specific to one installation and no credentials. Whether TLS is served here comes from
# there too: by default it is not, because the certificate usually lives on the proxy in front.
listening-port=3478

# The address the relay hands out. Without it a machine behind NAT advertises its private address
# and every candidate it offers is unusable.
# external-ip=<public ip>/<private ip>

# Credentials are minted by the backend and expire; no accounts live here. The backend signs
# "<expiry-unix>:<user>" with this secret, which is also why the secret must match its config.
# The secret itself is passed on the command line from the environment, so this file carries no
# credentials and can be committed as it stands.
use-auth-secret

# Relay range. Narrow enough to open in a firewall, wide enough for far more sessions than a
# household will ever have.
min-port=49160
max-port=49200

# A relay that will forward anywhere is an open proxy into whatever network it sits in. Phones
# only ever need to reach each other, so every internal range is refused as a peer.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Caps, so a leaked credential cannot run up a bill. A relayed audio session is about 30 kbit/s.
user-quota=12
total-quota=100
max-bps=256000

stale-nonce=600
fingerprint

# The admin interface is another way in and nothing here needs it.
no-cli

# Quiet by default; the backend's own log records who was issued credentials and when.
no-stdout-log
simple-log
log-file=stdout
