# The home relay. The same as turnserver.conf except for two things: its own ports, and that it may
# reach this house's own network. That is what a phone outside needs to reach one on the home WiFi
# when the router will not loop traffic for its own public address back in. Only phones holding the
# server key get a credential for it, and its secret differs from the open relay's.
listening-port=3480

# Set this to the same value as in turnserver.conf.
# external-ip=<public ip>/<private ip>

use-auth-secret

# Its own range, so both relays can run side by side on one host.
min-port=49201
max-port=49240

# Everything internal is refused here too. The one range it may reach is let through on the command
# line with --allowed-peer-ip, which wins over these.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

user-quota=12
total-quota=100
max-bps=256000

stale-nonce=600
fingerprint
no-cli
no-stdout-log
simple-log
log-file=stdout
