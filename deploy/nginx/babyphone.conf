# Babyphone in front of nginx. One file, included from the TOP level of nginx.conf:
#
#     include /etc/nginx/babyphone.conf;      # beside events and http, not inside them
#
# The stream block has to be at that level. If your nginx.conf already has an http block — most
# distributions do — move the server block below into it, or into sites-enabled, and leave the
# stream block here.
#
# Replace baby.example.com, example.com and DOCKER_HOST.

stream {
    # The relay over TLS. TURN inside TLS is an ordinary TCP stream, so nginx holds the
    # certificate and hands coturn the plain connection — which is why no private key has to be
    # copied to the Docker host. Only the last-resort path goes through here.
    server {
        listen 5349 ssl;

        ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

        proxy_pass DOCKER_HOST:3478;
    }
}

http {
    server {
        listen 80;
        server_name baby.example.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name baby.example.com;

        ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

        location / {
            proxy_pass http://DOCKER_HOST:7881;

            # Without these the app sees every request as plain HTTP from localhost, which breaks
            # secure-cookie decisions and the links it puts in email.
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # The signalling hub is a WebSocket held open for as long as the app runs. Without
            # these, no call ever connects and nothing says why.
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;

            proxy_buffering off;
        }
    }
}
