<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #181a1b;
            color: #e8e6e3;
            padding: 24px;
            margin: 0;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            background: #202324;
            padding: 28px;
            border-radius: 8px;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 16px;
        }

        p {
            font-size: 14px;
            line-height: 1.6;
            color: #cfccc7;
        }

        .button {
            display: inline-block;
            margin: 20px 0;
            padding: 12px 20px;
            background: #3fb950;
            color: #181a1b;
            font-weight: 600;
            text-decoration: none;
            border-radius: 6px;
        }

        .muted {
            font-size: 12px;
            color: #8b8b8b;
            word-break: break-all;
        }

        .footer {
            font-size: 12px;
            color: #6f6f6f;
            margin-top: 24px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>@Title</h1>
    <p>Confirm your email address to activate your Babyphone account.</p>
    <a class="button" href="@ConfirmUrl">Confirm my email</a>
    <p class="muted">If the button doesn't work, copy and paste this link into your browser:<br>@ConfirmUrl</p>
    <p class="footer">If you didn't create a Babyphone account, you can safely ignore this email.</p>
</div>
</body>
</html>
